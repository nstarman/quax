[project]
site_author      = "Nathaniel Starkman"
site_description = "The documentation for the Quax software library."
site_name        = "Quax"
site_url         = "https://nstarman.github.io/quax"

repo_name = "nstarman/quax"
repo_url  = "https://github.com/nstarman/quax"

extra_css = ["_static/custom_css.css"]
extra_javascript = [
  # The below two make MathJax work, see https://squidfunk.github.io/mkdocs-material/reference/mathjax/
  "_static/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  "index.md",
  { "Tutorials" = [
    "tutorials/use-a-quax-type.md",
    { "Custom rules (introductory)" = "examples/custom_rules.md" },
    { "Default rules (intermediate)" = "examples/default_rules.md" },
    { "Redispatching (advanced)" = "examples/redispatch.md" },
  ] },
  { "How-to" = [
    "how-to/combine-with-jit-and-vmap.md",
    "how-to/resolve-an-ambiguous-rule.md",
    "how-to/quaxify-part-of-a-function.md",
    "how-to/recover-a-nan-gradient.md",
    "how-to/transform-metadata-under-autodiff.md",
  ] },
  { "Explanation" = [
    "how-quaxify-works.md",
    "autodiff.md",
    "control-flow.md",
    "hijax.md",
    "why-not-built-on-hijax.md",
    "sharp-bits.md",
  ] },
  { "Reference" = [
    "api/quax.md",
    "api/lora.md",
    "api/unitful.md",
    "api/hijax.md",
    "api/experimental.md",
    "examples/other.md",
  ] },
  "faq.md",
]

[project.theme]
favicon = "_static/favicon.svg"
features = [
  "navigation.sections", # Sections are included in the navigation on the left.
  "toc.integrate",       # Table of contents is integrated on the left; does not appear separately on the right.
  "header.autohide",     # header disappears as you scroll
]

[project.theme.icon]
logo = "material/duck"             # Quax logo in top left
repo = "fontawesome/brands/github" # GitHub logo in top right

# Light mode / dark mode.
# We deliberately don't automatically use `media` to check a user's preferences. We default to light mode as
# (a) it looks more professional, and (b) is more obvious about the fact that it offers a (dark mode) toggle.
[[project.theme.palette]]
accent      = "amber"
primary     = "white"
scheme      = "default"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent      = "amber"
primary     = "black"
scheme      = "slate"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition                      = {}
pymdownx.arithmatex.generic     = true   # Render LaTeX via MathJax
pymdownx.details                = {}     # Allowing hidden expandable regions denoted by ???
pymdownx.snippets.base_path     = "docs" # Include one Markdown file into another
pymdownx.superfences            = {}     # Syntax highlighting for fenced code blocks
pymdownx.tabbed.alternate_style = true
toc.permalink                   = "¤"    # Adds a clickable permalink to each section heading
toc.toc_depth                   = 4

# See https://github.com/squidfunk/mkdocs-material/discussions/8116#discussioncomment-12632752
# and https://github.com/patrick-kidger/equinox/issues/984
# In particular this allows for searching e.g. 'filter_grad' and to match 'equinox.filter_grad'.
[project.plugins.search]
separator = '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

[project.plugins.mkdocstrings.handlers.python.options]
force_inspection           = true
heading_level              = 4
inherited_members          = true
members_order              = "source"
show_bases                 = false
show_if_no_docstring       = true
show_overloads             = false
show_root_heading          = true
show_signature_annotations = true
show_source                = false
show_symbol_type_heading   = true
show_symbol_type_toc       = true
