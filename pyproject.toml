[project]
authors = [
  { name = "Nathaniel Starkman", email = "nstarman@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "jax>=0.5.3,!=0.7.0,!=0.7.1",
  "jaxtyping>=0.3.3",
  "equinox>=0.13.2",
  "plum-dispatch>=2.2.1",
  "packaging>=20.0",
]
description = "Multiple dispatch in JAX via custom interpreters."
dynamic = ["version"]
keywords = ["jax", "multiple-dispatch", "equinox"]
license = { file = "LICENSE" }
name = "quax"
readme = "README.md"
requires-python = ">=3.10"
urls = { repository = "https://github.com/nstarman/quax" }

[project.optional-dependencies]
dev = ["pre-commit>=4.1.0"]
docs = [
  "hippogriffe==0.2.2",
  "mkdocstrings[python]==1.0.3",
  "nbconvert>=7",
  "pymdown-extensions==10.21.2",
  "zensical",
]
tests = ["beartype>=0.20.2", "pytest>=8.3.5", "pytest-env>=1.1.5", "jax[cpu]"]

[build-system]
build-backend = "hatchling.build"
requires      = ["hatch-vcs", "hatchling"]

[tool.hatch]
build.hooks.vcs.version-file = "src/quax/_version.py"
build.hooks.vcs.version-file-template = """\
version: str = {version!r}
version_tuple: tuple[int, int, int] | tuple[int, int, int, str, str]
version_tuple = {version_tuple!r}
"""
version.source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "v*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quax"]

[tool.pytest.ini_options]
addopts    = "--jaxtyping-packages=quax,beartype.beartype(conf=beartype.BeartypeConf(strategy=beartype.BeartypeStrategy.On))"
pythonpath = ["src"]

[tool.pytest_env]
JAX_CHECK_TRACER_LEAKS = 1

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore  = ["E402", "E721", "E731", "E741", "F722"]
select  = ["E", "F", "I001", "UP"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"jax.extend" = "jex"

[tool.ruff.lint.isort]
combine-as-imports     = true
extra-standard-library = ["typing_extensions"]
lines-after-imports    = 2
order-by-type          = false

[tool.pyright]
include                          = ["src/quax", "tests"]
reportIncompatibleMethodOverride = true
