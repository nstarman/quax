name: Run tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 4"  # Every Thursday at midnight UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  PYTHON_VERSIONS: '["3.11", "3.13", "3.14"]'

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ env.PYTHON_VERSIONS }}
      oldest-python: ${{ steps.versions.outputs.oldest }}
      newest-python: ${{ steps.versions.outputs.newest }}
    steps:
      - id: versions
        run: |
          versions='${{ env.PYTHON_VERSIONS }}'
          oldest=$(echo "$versions" | jq -r '.[0]')
          newest=$(echo "$versions" | jq -r '.[-1]')
          echo "oldest=$oldest" >> $GITHUB_OUTPUT
          echo "newest=$newest" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install
        run: uv sync --no-default-groups --group lint --locked

      - name: Checks with prek
        run: uv run --frozen prek run --all-files

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [lint, setup]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group tests --locked

      - name: Test with pytest
        run: uv run --frozen pytest

  oldest-supported:
    name: Oldest supported deps
    runs-on: ubuntu-latest
    needs: [lint, setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ needs.setup.outputs.oldest-python }}

      - name: Install the project
        run: uv sync --no-default-groups --group tests --resolution lowest-direct

      - name: Test package
        run: uv run --frozen pytest

  newest-supported:
    name: Newest supported deps
    runs-on: ubuntu-latest
    needs: [lint, setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install the project
        run: uv sync --no-default-groups --group tests --upgrade

      - name: Test package
        run: uv run --no-sync pytest

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest-python }}

      - name: Install
        run: uv sync --no-default-groups --group test-integration --locked

      - name: Test with pytest
        run: uv run --frozen pytest tests/integration README.md

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, setup, tests, oldest-supported, newest-supported, integration]
    if: always()
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
