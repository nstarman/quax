name: Run tests

on:
  pull_request:
  schedule:
    - cron: "0 0 * * 4"  # Every Thursday at midnight UTC

permissions:
  contents: read

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  run-test:
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.13" ]
        os: [ ubuntu-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,docs,tests]'

      - name: Checks with pre-commit
        run: |
          pre-commit run --all-files

      - name: Test with pytest
        run: |
          pytest

      - name: Check that documentation can be built.
        run: |
          mkdocs build

  oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install the project
        run: uv sync --extra dev --extra tests --resolution lowest-direct

      - name: Test package
        run: uv run --extra dev --extra tests --resolution lowest-direct pytest
